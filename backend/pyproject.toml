[project]
name = "strategy-activity-analysis-assistant"
version = "0.1.0"
description = "活动分析助手"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "deepagents==0.6.12",
    "langchain-anthropic>=1.4.7",
    "langchain-google-genai>=4.2.5",
    "langsmith>=0.8.11",
    "wcmatch>=10.1",
    "openai>=1.60",
    "tiktoken>=0.7",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "weasyprint>=62.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.130.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
